apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "greenroute.fullname" . }}-provider
  labels:
    {{- include "greenroute.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "greenroute.componentSelectorLabels" (list . "provider-yandex") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "greenroute.componentSelectorLabels" (list . "routing-orchestrator") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "greenroute.componentSelectorLabels" (list . "edge-api") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8082}
  egress:
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.providerEgressCIDR }}
            except:
              {{- toYaml .Values.networkPolicy.providerDeniedCIDRs | nindent 14 }}
      ports:
        - {protocol: TCP, port: 443}
    - to:
        - namespaceSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.observability.namespaceSelector | nindent 14 }}
      ports:
        - {protocol: TCP, port: 4318}
---
