apiVersion: v1
kind: Namespace
metadata:
  name: greenroute
  labels:
    app.kubernetes.io/name: greenroute
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: greenroute
  namespace: greenroute
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 24Gi
    # Covers all three HPAs at their production maxima, fixed workloads,
    # rolling-update surges and one migration Job without quota deadlock.
    limits.cpu: "80"
    limits.memory: 48Gi
    pods: "100"
    persistentvolumeclaims: "0"
    services.loadbalancers: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: greenroute
  namespace: greenroute
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
      max:
        cpu: "4"
        memory: 2Gi
