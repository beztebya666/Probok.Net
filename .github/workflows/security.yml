name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 2"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Code scanning needs GitHub Code Security on a private repository. Reading
  # the visibility here rather than from the event payload keeps the answer
  # right on scheduled runs too, where no repository object is delivered.
  visibility:
    name: Repository visibility
    runs-on: ubuntu-24.04
    outputs:
      public: ${{ steps.check.outputs.public }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "public=$(gh api "repos/${{ github.repository }}" --jq '.private == false')" >> "$GITHUB_OUTPUT"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

  sast:
    name: CodeQL (${{ matrix.language }})
    needs: visibility
    # Skipped rather than failed while the repository is private: the analysis
    # runs fine, but uploading its results is a paid feature, and a check that
    # can never pass teaches people to ignore red.
    if: needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [go, javascript-typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
      - uses: github/codeql-action/analyze@c3400c2f38909e0dcf3c3a41f2030a8217be5d3e # v3
        with:
          category: /language:${{ matrix.language }}

  dependencies-secrets-filesystem:
    name: Dependency, secret and filesystem scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Go vulnerability database scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: npm dependency audit
        run: npm --prefix apps/web ci --ignore-scripts && npm --prefix apps/web audit --audit-level=high
      - name: Secret history and worktree scan
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
          detect --source=/repo --config=/repo/.gitleaks.toml --no-banner --redact
      - name: Filesystem vulnerability and misconfiguration scan
        run: >-
          docker run --rm -v "$PWD:/repo" aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          fs --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln,misconfig,secret /repo
      # This binary is upstream's: the findings live in the Go toolchain and
      # libraries compiled into the release, and v7.15.3 is the newest one
      # published. Nothing in this repository can patch them, so a HIGH is
      # recorded in the run summary and read at the next bump, while a CRITICAL
      # still stops the pipeline — that is worth acting on before the fix lands.
      - name: Pinned authentication gateway image scan
        env:
          TRIVY: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          GATEWAY: quay.io/oauth2-proxy/oauth2-proxy@sha256:10a1165743a192e1940b4708fb9647027185ce11a681a1c5519b442ff7f1f561
        run: |
          docker run --rm "$TRIVY" image --severity HIGH,CRITICAL --ignore-unfixed "$GATEWAY" | tee gateway-scan.txt
          {
            echo "### Pinned authentication gateway image"
            echo '```'
            cat gateway-scan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          docker run --rm "$TRIVY" image --exit-code 1 --severity CRITICAL --ignore-unfixed "$GATEWAY"
