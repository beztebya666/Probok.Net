name: Load and failure tests

on:
  schedule:
    - cron: "17 1 * * 6"
  workflow_dispatch:
    inputs:
      scenario:
        description: Synthetic scenario to execute in the isolated stub environment
        type: choice
        required: true
        default: route-search
        options: [route-search, sse-reconnect, mass-cancellation, slow, rate-limit, outage]

concurrency:
  group: load-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  k6:
    name: k6 ${{ inputs.scenario || 'route-search' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build isolated stack
        run: docker compose -p greenroute-load up -d --build --wait postgres redis provider-yandex routing-orchestrator edge-api
      - name: Configure deterministic provider fault
        if: contains(fromJSON('["slow","rate-limit","outage"]'), inputs.scenario)
        env:
          SELECTED_SCENARIO: ${{ inputs.scenario }}
        run: |
          case "$SELECTED_SCENARIO" in
            rate-limit) provider_mode=rate_limit ;;
            *) provider_mode="$SELECTED_SCENARIO" ;;
          esac
          PROVIDER_STUB_SCENARIO="$provider_mode" docker compose -p greenroute-load up -d --force-recreate provider-yandex
          docker compose -p greenroute-load --profile observability up -d prometheus
      - name: Run selected k6 gate
        env:
          SELECTED_SCENARIO: ${{ inputs.scenario || 'route-search' }}
        run: |
          mkdir -p dist/load
          case "$SELECTED_SCENARIO" in
            route-search)
              docker compose -p greenroute-load --profile load run --rm \
                -e SUSTAINED_DURATION=1m -e PEAK_START=1m10s -e PEAK_HOLD=30s \
                k6 run --summary-export=/results/summary.json /scripts/route-search.js
              ;;
            sse-reconnect)
              docker compose -p greenroute-load --profile load run --rm \
                k6 run --summary-export=/results/summary.json /scripts/sse-reconnect.js
              ;;
            mass-cancellation)
              docker compose -p greenroute-load --profile load run --rm \
                k6 run --summary-export=/results/summary.json /scripts/mass-cancellation.js
              ;;
            slow|rate-limit|outage)
              expected=$(printf '%s' "$SELECTED_SCENARIO" | tr '-' '_')
              docker compose -p greenroute-load --profile observability --profile load run --rm \
                -e PROMETHEUS_URL=http://prometheus:9090 -e EXPECTED_FAILURE_MODE="$expected" \
                -e FAILURE_DURATION=1m k6 run --summary-export=/results/summary.json /scripts/provider-failures.js
              ;;
          esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: k6-${{ inputs.scenario || 'route-search' }}
          path: dist/load/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Capture diagnostics
        if: failure()
        run: docker compose -p greenroute-load --profile observability ps && docker compose -p greenroute-load --profile observability logs --no-color --tail=300
      - name: Remove isolated stack
        if: always()
        run: docker compose -p greenroute-load --profile observability --profile load down -v --remove-orphans
