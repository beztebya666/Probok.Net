name: Pages

# Publishes the browser demo. It is a static export in demo mode: every search
# is answered from fixtures inside the page, so the site holds no credentials
# and reaches no provider.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/media/**"
      - "tools/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy in one job: splitting them hands the artifact between jobs
  # for no benefit here, and leaves a half-finished deployment behind when the
  # deploy step times out.
  deploy:
    # GitHub Pages needs a paid plan to serve a private repository, so on a
    # private one there is nothing to deploy to. Skipping says that plainly
    # instead of failing every push with a 404 from the deploy step.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - name: Build the static demo
        env:
          # A project site is served from /<repo>/, so every asset needs that prefix.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: node tools/pages/build-static-demo.mjs
      # enablement turns Pages on for the repository the first time this runs,
      # so a fresh clone of the project deploys without a visit to Settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out
      - id: deployment
        uses: actions/deploy-pages@v4
